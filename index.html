<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const desktop = window.matchMedia("(min-width: 900px)").matches;
        let open = desktop;
        if (desktop) {
          try { open = window.localStorage.getItem("agrisync-sidebar") !== "closed"; } catch { open = true; }
        }
        document.documentElement.dataset.sidebar = open ? "open" : "closed";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#315943" />
    <meta name="description" content="AgriSync helps farmers make clearer market decisions." />
    <title>AgriSync — Market, in sync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
